version: '3.8'

services:
  # --- THE BRAIN ---
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      # This saves the AI model to your hard drive so it doesn't 
      # re-download every time you restart!
      - huggingface_cache:/root/.cache/huggingface

  # --- THE FACE ---
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend # Wait for the brain to exist before starting the face

# Create a storage space for the AI model
volumes:
  huggingface_cache: